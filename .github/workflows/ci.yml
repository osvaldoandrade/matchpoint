name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: bash -n install.sh
      - run: python3 tests/installers.py
      - if: runner.os == 'Linux'
        run: shellcheck install.sh
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test with locked memory available on Linux
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo prlimit --pid "$$" --memlock=unlimited:unlimited
          fi
          cargo test --locked --all-targets --all-features
  windows-bootstrap:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: ./tests/installers.Tests.ps1
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit --file Cargo.lock
      - run: docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.1 dir --redact --no-banner /repo
