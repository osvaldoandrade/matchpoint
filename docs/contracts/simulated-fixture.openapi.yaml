openapi: 3.1.0
info:
  title: pgm-data simulated fixture
  version: 1.0.0
  description: >
    Local test contract only. It is not the PicPay production API.
    Enabled solely for loopback URLs with test mode and contract
    simulated-fixture-v1.
paths:
  /oauth/token:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Bearer token JSON with expires_in and optional refresh_token.
  /v1/intent:
    post:
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          description: "{job_id}:{row_id}. Must not contain the CPF."
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cpf]
              properties:
                cpf: { type: string }
      responses:
        '200':
          description: Closed fixture. is_customer is set only from customer_evidence.
          content:
            application/json:
              schema:
                type: object
                required: [fixture_version, disposition, request_id]
                properties:
                  fixture_version: { const: 1 }
                  disposition: { const: closed }
                  request_id: { type: string }
                  customer_evidence:
                    anyOf:
                      - { const: customer }
                      - { const: not_customer }
                      - { type: 'null' }
        default:
          description: Non-fixture bodies and non-success statuses are not business success.
